<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>VOOL for your phone</title>
<style>
:root { --bg:#f7f5f2; --ink:#24211e; --soft:#6d6862; --card:#ffffff; --line:#e4dfd8; --accent:#3c6e71; --on-accent:#ffffff; }
@media (prefers-color-scheme: dark) { :root { --bg:#161514; --ink:#ece8e3; --soft:#a8a29b; --card:#1f1e1c; --line:#33302d; --accent:#7fb3b5; --on-accent:#10201f; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
main { max-width:560px; margin:0 auto; padding:32px 16px 48px; }
h1 { font-size:26px; margin:0 0 8px; }
.lead { color:var(--soft); margin:0 0 24px; }
section { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin:0 0 14px; }
h2 { font-size:17px; margin:0 0 8px; }
p { margin:6px 0; overflow-wrap:anywhere; }
.btn { display:inline-block; background:var(--accent); color:var(--on-accent); text-decoration:none; font-weight:600; padding:12px 18px; border-radius:12px; margin:6px 0; }
.soft { color:var(--soft); font-size:14px; }
a { color:var(--accent); }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">VOOL for your phone</h1>
  <p class="lead" id="lead"></p>
  <p class="soft" id="other" hidden></p>
  <section id="android" hidden>
    <h2>Android</h2>
    <p class="soft" id="checking"></p>
    <a class="btn" id="android-get" hidden></a>
    <p class="soft" id="android-help" hidden></p>
    <p id="android-none" hidden></p>
    <p id="fallback" hidden><span id="fallback-text"></span> <a id="fallback-link"></a></p>
  </section>
  <section id="iphone" hidden>
    <h2>iPhone</h2>
    <p id="iphone-text"></p>
  </section>
  <p class="soft" id="then"></p>
</main>
<script>
/* One page for every phone. A QR code cannot tell which phone scans it; this page can, so it shows
   the matching download. Downloads come only from this repository's own releases. Nothing is stored
   and nothing is sent anywhere except one read of the public release list. */
(function () {
  "use strict";
  var REPO = "Parad0x-Labs/vool";
  var RELEASES = "https://github.com/" + REPO + "/releases";
  var WORDS = {"en":{"title":"VOOL for your phone","lead":"VOOL lives on your computer. The phone app lets you chat with it from your pocket, privately.","android_btn":"Download for Android","android_help":"When the download finishes, open it and allow the install if your phone asks.","android_none":"The Android app is not ready to download yet.","iphone":"The iPhone app is not ready to download yet.","other":"Open this page on your phone and it shows the right download.","then":"Next: open VOOL on your computer, go to Settings, then Phone and chat apps, and press Pair a phone.","checking":"Looking for the newest version…","fallback":"Could not check just now. All downloads are here:"},"ar":{"title":"VOOL على هاتفك","lead":"يعمل VOOL على حاسوبك. يتيح لك تطبيق الهاتف التحدث معه من جيبك، بخصوصية.","android_btn":"تنزيل لأندرويد","android_help":"عند انتهاء التنزيل، افتحه واسمح بالتثبيت إذا طلب هاتفك ذلك.","android_none":"تطبيق أندرويد غير جاهز للتنزيل بعد.","iphone":"تطبيق iPhone غير جاهز للتنزيل بعد.","other":"افتح هذه الصفحة على هاتفك وستعرض لك التنزيل المناسب.","then":"التالي: افتح VOOL على حاسوبك، وانتقل إلى الإعدادات ثم الهاتف وتطبيقات المحادثة، واضغط إقران هاتف.","checking":"جارٍ البحث عن أحدث إصدار…","fallback":"تعذّر التحقق الآن. كل التنزيلات هنا:"},"de":{"title":"VOOL für dein Handy","lead":"VOOL läuft auf deinem Computer. Mit der Handy-App chattest du von unterwegs mit ihm, ganz privat.","android_btn":"Für Android herunterladen","android_help":"Öffne die Datei nach dem Download und erlaube die Installation, wenn dein Handy fragt.","android_none":"Die Android-App kann noch nicht heruntergeladen werden.","iphone":"Die iPhone-App kann noch nicht heruntergeladen werden.","other":"Öffne diese Seite auf deinem Handy, dann zeigt sie den passenden Download.","then":"Danach: Öffne VOOL auf deinem Computer, geh zu Einstellungen, dann Telefon und Chat-Apps, und tippe auf Telefon koppeln.","checking":"Suche nach der neuesten Version…","fallback":"Gerade konnte nicht nachgesehen werden. Alle Downloads findest du hier:"},"es":{"title":"VOOL en tu móvil","lead":"VOOL vive en tu ordenador. La app del móvil te deja chatear con él desde el bolsillo, en privado.","android_btn":"Descargar para Android","android_help":"Cuando termine la descarga, ábrela y permite la instalación si tu móvil lo pide.","android_none":"La app de Android todavía no se puede descargar.","iphone":"La app de iPhone todavía no se puede descargar.","other":"Abre esta página en tu móvil y te mostrará la descarga correcta.","then":"Después: abre VOOL en tu ordenador, ve a Ajustes, luego Teléfono y aplicaciones de chat, y pulsa Vincular un teléfono.","checking":"Buscando la versión más reciente…","fallback":"No se pudo comprobar ahora. Todas las descargas están aquí:"},"fr":{"title":"VOOL sur votre téléphone","lead":"VOOL vit sur votre ordinateur. L’app téléphone vous permet de discuter avec lui depuis votre poche, en privé.","android_btn":"Télécharger pour Android","android_help":"Une fois le téléchargement terminé, ouvrez-le et autorisez l’installation si votre téléphone le demande.","android_none":"L’app Android n’est pas encore disponible au téléchargement.","iphone":"L’app iPhone n’est pas encore disponible au téléchargement.","other":"Ouvrez cette page sur votre téléphone et elle affichera le bon téléchargement.","then":"Ensuite : ouvrez VOOL sur votre ordinateur, allez dans Réglages, puis Téléphone et applications de discussion, et appuyez sur Associer un téléphone.","checking":"Recherche de la dernière version…","fallback":"Impossible de vérifier pour l’instant. Tous les téléchargements sont ici :"},"he":{"title":"VOOL בטלפון שלך","lead":"VOOL פועל במחשב שלך. אפליקציית הטלפון מאפשרת לך לשוחח איתו מהכיס, באופן פרטי.","android_btn":"הורדה לאנדרואיד","android_help":"כשההורדה מסתיימת, פתח אותה ואשר את ההתקנה אם הטלפון מבקש.","android_none":"אפליקציית האנדרואיד עדיין לא זמינה להורדה.","iphone":"אפליקציית ה-iPhone עדיין לא זמינה להורדה.","other":"פתח את הדף הזה בטלפון והוא יציג את ההורדה המתאימה.","then":"אחר כך: פתח את VOOL במחשב, עבור אל הגדרות ואז אל טלפון ויישומי צ׳אט, ולחץ על קישור טלפון.","checking":"מחפש את הגרסה החדשה ביותר…","fallback":"לא ניתן היה לבדוק כרגע. כל ההורדות נמצאות כאן:"},"hi":{"title":"आपके फ़ोन पर VOOL","lead":"VOOL आपके कंप्यूटर पर चलता है। फ़ोन ऐप से आप जेब से ही उससे निजी तौर पर बात कर सकते हैं।","android_btn":"Android के लिए डाउनलोड करें","android_help":"डाउनलोड पूरा होने पर उसे खोलें और फ़ोन पूछे तो इंस्टॉल की अनुमति दें।","android_none":"Android ऐप अभी डाउनलोड के लिए तैयार नहीं है।","iphone":"iPhone ऐप अभी डाउनलोड के लिए तैयार नहीं है।","other":"यह पेज अपने फ़ोन पर खोलें, यह सही डाउनलोड दिखाएगा।","then":"इसके बाद: अपने कंप्यूटर पर VOOL खोलें, सेटिंग्स और फिर फ़ोन और चैट ऐप में जाएँ, और फ़ोन जोड़ें दबाएँ।","checking":"नया संस्करण खोजा जा रहा है…","fallback":"अभी जाँच नहीं हो सकी। सभी डाउनलोड यहाँ हैं:"},"ja":{"title":"スマホで使う VOOL","lead":"VOOL はあなたのパソコンで動きます。スマホアプリを使えば、外出先からでも VOOL とプライベートに話せます。","android_btn":"Android 版をダウンロード","android_help":"ダウンロードが終わったら開き、スマホに聞かれたらインストールを許可してください。","android_none":"Android アプリはまだダウンロードできません。","iphone":"iPhone アプリはまだダウンロードできません。","other":"このページをスマホで開くと、合ったダウンロードが表示されます。","then":"次に、パソコンで VOOL を開き、「設定」→「電話とチャットアプリ」に進んで、「電話をペアリング」を押してください。","checking":"最新バージョンを探しています…","fallback":"今は確認できませんでした。すべてのダウンロードはこちら:"},"ko":{"title":"휴대폰에서 쓰는 VOOL","lead":"VOOL은 내 컴퓨터에서 실행됩니다. 휴대폰 앱으로 어디서나 VOOL과 비공개로 대화할 수 있습니다.","android_btn":"Android용 다운로드","android_help":"다운로드가 끝나면 열고, 휴대폰이 물으면 설치를 허용하세요.","android_none":"Android 앱은 아직 다운로드할 수 없습니다.","iphone":"iPhone 앱은 아직 다운로드할 수 없습니다.","other":"이 페이지를 휴대폰에서 열면 맞는 다운로드가 표시됩니다.","then":"다음: 컴퓨터에서 VOOL을 열고 설정 > 휴대폰과 채팅 앱에서 ‘휴대폰 페어링’ 버튼을 누르세요.","checking":"최신 버전을 찾는 중…","fallback":"지금은 확인할 수 없습니다. 모든 다운로드는 여기에 있습니다:"},"lt":{"title":"VOOL jūsų telefone","lead":"VOOL veikia jūsų kompiuteryje. Su telefono programėle galite privačiai su juo kalbėtis iš kišenės.","android_btn":"Atsisiųsti Android","android_help":"Kai atsisiuntimas baigsis, atidarykite jį ir leiskite įdiegti, jei telefonas paklaus.","android_none":"Android programėlės dar negalima atsisiųsti.","iphone":"iPhone programėlės dar negalima atsisiųsti.","other":"Atidarykite šį puslapį telefone ir jis parodys tinkamą atsisiuntimą.","then":"Toliau: kompiuteryje atidarykite VOOL, eikite į „Nustatymai“, tada „Telefonas ir pokalbių programėlės“, ir paspauskite „Susieti telefoną“.","checking":"Ieškoma naujausios versijos…","fallback":"Dabar nepavyko patikrinti. Visi atsisiuntimai čia:"},"pl":{"title":"VOOL na telefonie","lead":"VOOL działa na Twoim komputerze. Aplikacja na telefon pozwala prywatnie rozmawiać z nim z kieszeni.","android_btn":"Pobierz na Androida","android_help":"Gdy pobieranie się skończy, otwórz plik i zezwól na instalację, jeśli telefon zapyta.","android_none":"Aplikacji na Androida nie można jeszcze pobrać.","iphone":"Aplikacji na iPhone’a nie można jeszcze pobrać.","other":"Otwórz tę stronę na telefonie, a pokaże właściwe pobieranie.","then":"Dalej: otwórz VOOL na komputerze, przejdź do „Ustawienia”, potem „Telefon i komunikatory”, i naciśnij „Sparuj telefon”.","checking":"Szukam najnowszej wersji…","fallback":"Nie udało się teraz sprawdzić. Wszystkie pliki do pobrania są tutaj:"},"pt":{"title":"VOOL no seu telemóvel","lead":"O VOOL vive no seu computador. A app do telemóvel deixa-o conversar com ele a partir do bolso, em privado.","android_btn":"Transferir para Android","android_help":"Quando a transferência terminar, abra-a e permita a instalação se o telemóvel pedir.","android_none":"A app Android ainda não está disponível para transferir.","iphone":"A app iPhone ainda não está disponível para transferir.","other":"Abra esta página no telemóvel e ela mostra a transferência certa.","then":"A seguir: abra o VOOL no computador, vá a Configurações, depois Telefone e aplicações de conversa, e carregue em Associar um telefone.","checking":"A procurar a versão mais recente…","fallback":"Não foi possível verificar agora. Todas as transferências estão aqui:"},"ru":{"title":"VOOL на телефоне","lead":"VOOL работает на вашем компьютере. Приложение для телефона позволяет общаться с ним из кармана, приватно.","android_btn":"Скачать для Android","android_help":"Когда загрузка закончится, откройте файл и разрешите установку, если телефон спросит.","android_none":"Приложение для Android пока нельзя скачать.","iphone":"Приложение для iPhone пока нельзя скачать.","other":"Откройте эту страницу на телефоне, и она покажет нужную загрузку.","then":"Дальше: откройте VOOL на компьютере, перейдите в «Настройки», затем «Телефон и мессенджеры», и нажмите «Подключить телефон».","checking":"Ищем самую новую версию…","fallback":"Сейчас не удалось проверить. Все загрузки здесь:"},"tr":{"title":"Telefonunda VOOL","lead":"VOOL bilgisayarında çalışır. Telefon uygulamasıyla onunla cebinden, gizlice sohbet edebilirsin.","android_btn":"Android için indir","android_help":"İndirme bitince dosyayı aç ve telefonun sorarsa kuruluma izin ver.","android_none":"Android uygulaması henüz indirilemiyor.","iphone":"iPhone uygulaması henüz indirilemiyor.","other":"Bu sayfayı telefonunda aç, doğru indirmeyi gösterir.","then":"Sonra: bilgisayarında VOOL’u aç, “Ayarlar”, ardından “Telefon ve sohbet uygulamaları” bölümüne git ve “Telefon eşleştir” düğmesine bas.","checking":"En yeni sürüm aranıyor…","fallback":"Şu anda kontrol edilemedi. Tüm indirmeler burada:"},"uk":{"title":"VOOL на телефоні","lead":"VOOL працює на вашому комп’ютері. Застосунок для телефона дає змогу спілкуватися з ним із кишені, приватно.","android_btn":"Завантажити для Android","android_help":"Коли завантаження завершиться, відкрийте файл і дозвольте встановлення, якщо телефон запитає.","android_none":"Застосунок для Android поки не можна завантажити.","iphone":"Застосунок для iPhone поки не можна завантажити.","other":"Відкрийте цю сторінку на телефоні, і вона покаже потрібне завантаження.","then":"Далі: відкрийте VOOL на комп’ютері, перейдіть у «Налаштування», потім «Телефон і месенджери», і натисніть «Підключити телефон».","checking":"Шукаємо найновішу версію…","fallback":"Зараз не вдалося перевірити. Усі завантаження тут:"},"vi":{"title":"VOOL trên điện thoại","lead":"VOOL chạy trên máy tính của bạn. Ứng dụng điện thoại cho phép bạn trò chuyện với nó ngay từ túi, một cách riêng tư.","android_btn":"Tải về cho Android","android_help":"Khi tải xong, hãy mở tệp và cho phép cài đặt nếu điện thoại hỏi.","android_none":"Ứng dụng Android chưa thể tải về.","iphone":"Ứng dụng iPhone chưa thể tải về.","other":"Mở trang này trên điện thoại và trang sẽ hiện bản tải phù hợp.","then":"Tiếp theo: mở VOOL trên máy tính, vào Cài đặt, rồi Điện thoại và ứng dụng trò chuyện, và bấm Ghép đôi điện thoại.","checking":"Đang tìm phiên bản mới nhất…","fallback":"Hiện chưa kiểm tra được. Mọi bản tải về đều ở đây:"},"zh-Hans":{"title":"手机上的 VOOL","lead":"VOOL 运行在你的电脑上。用手机应用，随时随地私密地和它聊天。","android_btn":"下载 Android 版","android_help":"下载完成后打开文件，如果手机询问，请允许安装。","android_none":"Android 应用暂时还不能下载。","iphone":"iPhone 应用暂时还不能下载。","other":"在手机上打开此页面，它会显示合适的下载。","then":"接下来：在电脑上打开 VOOL，进入“设置”，再进入“手机与聊天应用”，然后点按“配对手机”。","checking":"正在查找最新版本…","fallback":"现在无法检查。所有下载都在这里："}};
  var RTL = { ar: 1, he: 1 };

  function pickLang() {
    var wanted = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]);
    for (var i = 0; i < wanted.length; i++) {
      var tag = String(wanted[i] || "");
      if (/^zh/i.test(tag)) return "zh-Hans";
      var base = tag.split("-")[0].toLowerCase();
      if (base === "iw") base = "he";
      if (WORDS[base]) return base;
    }
    return "en";
  }
  var lang = pickLang();
  var w = WORDS[lang];
  document.documentElement.lang = lang;
  if (RTL[lang]) document.documentElement.dir = "rtl";
  function say(id, key) { document.getElementById(id).textContent = w[key]; }
  function show(id) { document.getElementById(id).hidden = false; }
  function hide(id) { document.getElementById(id).hidden = true; }

  document.title = w.title;
  say("title", "title"); say("lead", "lead"); say("then", "then");
  say("checking", "checking"); say("android-get", "android_btn"); say("android-help", "android_help");
  say("android-none", "android_none"); say("iphone-text", "iphone"); say("other", "other");
  say("fallback-text", "fallback");
  var fallbackLink = document.getElementById("fallback-link");
  fallbackLink.href = RELEASES; fallbackLink.textContent = RELEASES.replace(/^https:\/\//, "");

  var ua = navigator.userAgent || "";
  var isIphone = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  if (isIphone) { show("iphone"); }
  else if (isAndroid) { show("android"); }
  else { show("other"); show("android"); show("iphone"); }

  if (document.getElementById("android").hidden) return;
  show("checking");
  fetch("https://api.github.com/repos/" + REPO + "/releases?per_page=20", { headers: { Accept: "application/vnd.github+json" } })
    .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(function (releases) {
      hide("checking");
      for (var i = 0; i < releases.length; i++) {
        var rel = releases[i];
        if (!rel || rel.draft) continue;
        var assets = rel.assets || [];
        for (var j = 0; j < assets.length; j++) {
          var name = String(assets[j].name || "");
          if (/\.apk$/i.test(name) && /^https:\/\/github\.com\//.test(String(assets[j].browser_download_url || ""))) {
            var get = document.getElementById("android-get");
            get.href = assets[j].browser_download_url;
            show("android-get"); show("android-help");
            return;
          }
        }
      }
      show("android-none");
    })
    .catch(function () { hide("checking"); show("fallback"); });
})();
</script>
</body>
</html>
