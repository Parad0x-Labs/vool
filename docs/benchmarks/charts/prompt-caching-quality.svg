<circle cx="315.8" cy="284" r="6" fill="var(--grey)" stroke="var(--axis)"/>
<circle cx="373.3" cy="284" r="6" fill="var(--grey)" stroke="var(--axis)"/>
<circle cx="680.0" cy="284" r="8" fill="var(--acc)"/>
