# Deliberate non-features: census routes and pinned tools that no row claims,
# each with the reason they are not user features.
internal:
  - reason: Page shells, redirects and static asset transports that carry the mapped interface.
    routes: ["/", "/chat-assets/*", "/settings", "/healthz"]
  - reason: Working-task rail page opened from the chat working card.
    routes: ["/task-rail"]
  - reason: Command registry projection and dispatch door (registry-owned, machine lane).
    routes: ["/api/commands", "/api/commands/*", "/api/commands/dispatch"]
  - reason: Local model server compatibility endpoints in the style of the local runner API.
    routes: ["/api/generate", "/api/show", "/api/tags"]
  - reason: Machine-lane mirrors of app routes for external tools; not app features.
    routes: ["/v1/models", "/v1/healthz", "/v1/runtime/capabilities", "/v1/runtime/changes", "/v1/runtime/usage", "/v1/runtime/version", "/v1/wallet/info"]
  - reason: Live self-report of what this machine can do; per-machine tooling feed, not a feature.
    routes: ["/api/runtime/capabilities"]
  - reason: Runtime control-plane status feed for operators.
    routes: ["/api/runtime/control-plane/status"]
  - reason: Diagnostic snapshot of operator state for support.
    routes: ["/api/runtime/operator-snapshot"]
  - reason: Cloud lane diagnostics feed.
    routes: ["/api/cloud/diagnostics"]
  - reason: Preference read and write door shared by every settings card; the cards are the mapped rows.
    routes: ["/api/settings/prefs"]
  - reason: First-run pact read kept after its page was retired.
    routes: ["/api/onboarding/pact"]
  - reason: Remaining onboarding writes without a page caller; the pact boundary write among them can still turn the web switch on.
    routes: ["/api/onboarding/*"]
  - reason: Owner-local money budget reads and reconcile door with no page caller; the marketplace card's two callers are mapped there.
    routes: ["/api/money/contract", "/api/money/funding", "/api/money/grants", "/api/money/liabilities", "/api/money/liabilities/{id}", "/api/money/rules", "/api/money/reconcile"]
  - reason: Research intake quarantine (security lane for shared research intake).
    routes: ["/api/intake/quarantine/list", "/api/intake/*"]
  - reason: Recovery door for tasks interrupted by a crash.
    routes: ["/api/task/recovery"]
  - reason: Product-edition gate unlock door.
    routes: ["/gate/unlock"]
  - reason: School edition pages; not the personal app.
    routes: ["/school", "/school/api/state", "/school/student", "/school/api/*"]
  - reason: Frozen prose demand-routing inside chat turns; product law keeps these out of the command surface. The spend freeze is mapped as a row; the rest are not features.
    census: ["chat-family:cloud", "chat-family:help", "chat-family:new-family", "chat-family:prefs", "chat-family:secret-intake", "chat-family:slash-refusal", "chat-family:trace-family"]
  - reason: Terminal REPL session commands; operator and development doors, not app features.
    census: ["chat-repl:/balance", "chat-repl:/capabilities", "chat-repl:/credits", "chat-repl:/dial", "chat-repl:/exit", "chat-repl:/manifest", "chat-repl:/quit", "chat-repl:/quote", "chat-repl:/resolve", "chat-repl:/status", "chat-repl:/web"]
  - reason: Blackbox turn-record diagnostics for development.
    census: ["cli-module:core.blackbox:rollback", "cli-module:core.blackbox:status", "cli-module:core.blackbox:turns", "cli-module:core.blackbox:verify"]
  - reason: Service entry scripts that start, stop or drive the app from a terminal.
    census: ["cli-script:vool", "cli-script:vool-agent", "cli-script:vool-api", "cli-script:vool-benchmark", "cli-script:vool-community", "cli-script:vool-daemon", "cli-script:vool-meet", "cli-script:vool-registry", "cli-script:vool-watch"]
