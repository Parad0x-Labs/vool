# VOOL app map
# schema vool.app-map.v1 — one row per user-facing feature; every reference in a row
# is checked against the code by ops/app_map_check.py (run from the repo root).
# Labels are judgement calls copied from the internal draft; the checker only proves
# the references are real. "source_commit" is the commit the rows were checked on.
schema: vool.app-map.v1
