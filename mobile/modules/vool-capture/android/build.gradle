apply plugin: 'com.android.library'

group = 'systems.vool.capture'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "systems.vool.capture"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

def cameraxVersion = "1.4.1"

dependencies {
  implementation "androidx.camera:camera-core:${cameraxVersion}"
  implementation "androidx.camera:camera-camera2:${cameraxVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
  implementation "androidx.camera:camera-view:${cameraxVersion}"
  implementation "androidx.camera:camera-video:${cameraxVersion}"
  implementation "androidx.camera:camera-extensions:${cameraxVersion}"
  // used only by the optional compression (systems.vool.capture.compress)
  implementation "androidx.media3:media3-transformer:1.4.1"
  implementation "androidx.media3:media3-effect:1.4.1"
  implementation "androidx.media3:media3-common:1.4.1"
  // VOOL Vault: plays a video or recording from its sealed stream
  implementation "androidx.media3:media3-exoplayer:1.4.1"
  implementation "androidx.media3:media3-ui:1.4.1"
  implementation "androidx.heifwriter:heifwriter:1.0.0"
  implementation "androidx.exifinterface:exifinterface:1.3.7"
  // VOOL Camera photo modes (Enhance, Beauty, Document): OpenCV 4.12.0, Apache-2.0, from Maven Central.
  // Only its arm64 library ships (the app is arm64 only); its x86 builds carry Intel IPP and are left out.
  implementation "org.opencv:opencv:4.12.0"
}
