# The Skill Codex signer. Every few minutes it checks new uploads, signs what passes, applies the
# team's steps from team-steps.txt and keeps the signed list fresh. Uploads are never stored here.
# Only the team can change this repository; secrets reach only the "Sign" step.
name: Skill Codex signer

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths: [team-steps.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skill-codex-signer
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the signer's state
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Read the pinned VOOL commit
        id: pin
        run: |
          commit="$(tr -d '[:space:]' < authority/vool-commit)"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "authority/vool-commit must hold one full commit id"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Check out VOOL's checks at that commit
        uses: actions/checkout@v7
        with:
          repository: Parad0x-Labs/vool
          ref: ${{ steps.pin.outputs.commit }}
          path: .vool
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: .vool/pyproject.toml
      - name: Install VOOL's own dependencies
        run: python -m pip install --disable-pip-version-check --quiet -e ./.vool
      - name: Sign
        working-directory: .vool
        env:
          SKILL_CODEX_SERVER: ${{ secrets.SKILL_CODEX_SERVER }}
          SKILL_CODEX_ADMISSION_KEY: ${{ secrets.SKILL_CODEX_ADMISSION_KEY }}
          SKILL_CODEX_REVIEW_KEY: ${{ secrets.SKILL_CODEX_REVIEW_KEY }}
          SKILL_CODEX_STATE_KEY: ${{ secrets.SKILL_CODEX_STATE_KEY }}
          VOOL_AUTHORITY_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m registry_service.github_authority run --repo "$GITHUB_WORKSPACE"
