name: macOS stub lanes debug 2

# V-1 iteration 3. Iteration 2 reproduced the drop-out on the runner (20 failed in ci.yml
# order; the stub's own reply: "could not run this turn: its provider lane is not available
# right now") but the model_selection_policy probes never fired -- so the exclusion either
# early-returns before the end-of-function logger or never reaches that module, and the
# daemon's logging config may swallow the logger anyway. This round dumps AT the decision
# site (the explicit-pin branch that emits selected_provider_excluded_before_invocation),
# via print(flush=True) so the rig's daemon.log capture gets it regardless of logging
# config: model pin, task kind/mode, policy local-only, the FULL manifest inventory with
# enabled state (disabled manifests included), the per-manifest exclusion explanation, and
# provider health snapshots. Plus a patch self-check printed in the job log.

on:
  push:
    branches: [debug/macos-stub-lanes2]

concurrency:
  group: macos-stub-lanes2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser,companion,evm]"
      - name: Provision the served-browser lane (Playwright chromium)
        run: python -m playwright install --with-deps chromium
      - name: Instrument the pin-blocked decision site
        run: |
          python - <<'EOF'
          import base64
          from pathlib import Path

          B_OLD = ""
          B_NEW = ""

          C_OLD = ""
          C_NEW = ""
          p2 = Path("core/model_registry.py")
          src2 = p2.read_text()
          old2, new2 = base64.b64decode(C_OLD).decode(), base64.b64decode(C_NEW).decode()
          assert src2.count(old2) == 1, "registry anchor count"
          src2 = src2.replace(old2, new2, 1)
          compile(src2, str(p2), "exec")
          p2.write_text(src2)
          print("PATCH-APPLIED: RANK-REQ capture wired into model_registry")

          p = Path("core/memory_first_router.py")
          src = p.read_text()
          old, new = base64.b64decode(B_OLD).decode(), base64.b64decode(B_NEW).decode()
          assert src.count(old) == 1, "anchor count"
          src = src.replace(old, new, 1)
          compile(src, str(p), "exec")
          p.write_text(src)
          print("PATCH-APPLIED: PIN-BLOCKED dump wired into memory_first_router")
          print("PATCH-VERIFY:", "PIN-BLOCKED" in Path("core/memory_first_router.py").read_text())
          EOF
      - name: Run the macOS job suites in ci.yml order
        run: |
          set +e
          python -m pytest -q --tb=line -p no:cacheprovider \
            tests/test_macos_app_packaging.py \
            tests/updater/test_e2e_sandbox.py \
            tests/test_artifact_readers_contracts.py \
            tests/test_artifact_readers_served_m1.py \
            tests/test_artifact_readers_served_m2.py \
            tests/test_audio_dictation.py \
            tests/test_media_product_served.py 2>&1 | tail -30
          echo "pytest rc=$?"
      - name: Dump the pin-blocked evidence from daemon logs
        if: always()
        run: |
          set +e
          echo "=== PIN-BLOCKED lines from every recent daemon.log ==="
          for BASE in /tmp /var/folders; do
            find "$BASE" -maxdepth 8 -name "daemon.log" -newermt "-40 minutes" 2>/dev/null | head -20
          done | while read -r LOG; do
            if grep -qE "PIN-BLOCKED|RANK-REQ" "$LOG" 2>/dev/null; then
              echo "===== $LOG ====="
              grep -E "PIN-BLOCKED|RANK-REQ" "$LOG" | sort | uniq -c | sort -rn | head -40
            fi
          done
