name: Windows Release Gauntlet

concurrency:
  group: windows-release-gauntlet-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-release-gauntlet.yml"
      - "Install_And_Run_NULLA.ps1"
      - "Install_And_Run_NULLA.bat"
      - "Test_NULLA_Windows_Gauntlet.cmd"
      - "installer/**"
      # Only the core modules this gauntlet's tests actually import. A blanket core/** triggered a
      # 2x-billed Windows runner for routing and context edits that cannot reach the installer
      # surface; ubuntu CI still covers every one of these files on each push, and only
      # test_model_store_planner.py is genuinely win32-gated.
      - "core/hardware_tier.py"
      - "core/install_recommendations.py"
      - "core/local_model_bundles.py"
      - "core/model_store_planner.py"
      - "core/openclaw_locator.py"
      - "core/provider_routing.py"
      - "core/public_hive_bridge.py"
      - "core/runtime_backbone.py"
      - "tools/windows_fresh_host_gauntlet.ps1"
      - "tests/test_hardware_tier.py"
      - "tests/test_model_store_planner.py"
      - "tests/test_provider_probe.py"
      - "tests/test_provider_probe_contract.py"
      - "tests/test_install_script_contract.py"
      - "tests/test_install_surface_contracts.py"
      - "tests/test_local_only_policy.py"
      - "tests/test_validate_install_profile.py"
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/windows-release-gauntlet.yml"
      - "Install_And_Run_NULLA.ps1"
      - "Install_And_Run_NULLA.bat"
      - "Test_NULLA_Windows_Gauntlet.cmd"
      - "installer/**"
      # Only the core modules this gauntlet's tests actually import. A blanket core/** triggered a
      # 2x-billed Windows runner for routing and context edits that cannot reach the installer
      # surface; ubuntu CI still covers every one of these files on each push, and only
      # test_model_store_planner.py is genuinely win32-gated.
      - "core/hardware_tier.py"
      - "core/install_recommendations.py"
      - "core/local_model_bundles.py"
      - "core/model_store_planner.py"
      - "core/openclaw_locator.py"
      - "core/provider_routing.py"
      - "core/public_hive_bridge.py"
      - "core/runtime_backbone.py"
      - "tools/windows_fresh_host_gauntlet.ps1"
      - "tests/test_hardware_tier.py"
      - "tests/test_model_store_planner.py"
      - "tests/test_provider_probe.py"
      - "tests/test_provider_probe_contract.py"
      - "tests/test_install_script_contract.py"
      - "tests/test_install_surface_contracts.py"
      - "tests/test_local_only_policy.py"
      - "tests/test_validate_install_profile.py"
  workflow_dispatch:

jobs:
  gauntlet:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with runtime test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Windows gauntlet without live model pull
        shell: cmd
        run: Test_NULLA_Windows_Gauntlet.cmd -SkipInstall -SkipBenchmark -Json
      - name: Upload gauntlet report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vool-windows-gauntlet-report
          path: dist/windows-gauntlet/*.json
