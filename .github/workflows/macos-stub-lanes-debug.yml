name: macOS stub lanes debug

on:
  push:
    branches: [debug/macos-stub-lanes]

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser,companion,evm]"
      - name: Run the reader served suites with diagnostics
        run: |
          set +e
          python -m pytest -q --tb=short -p no:cacheprovider tests/test_artifact_readers_served_m2.py tests/test_artifact_readers_served_m1.py 2>&1 | tail -60
          echo "pytest done rc=$?"
      - name: Dump daemon evidence from the rig homes
        if: always()
        run: |
          set +e
          echo "=== candidate homes (tmp + per-user) ==="
          for BASE in /tmp /var/folders; do
            find "$BASE" -maxdepth 8 -name "vool_web0_v2.db" -newermt "-30 minutes" 2>/dev/null | head -10
          done
          for DB in $(for BASE in /tmp /var/folders; do find "$BASE" -maxdepth 8 -name "vool_web0_v2.db" -newermt "-30 minutes" 2>/dev/null; done | head -6); do
            HOME_DIR=$(dirname "$(dirname "$DB")")
            echo "===== HOME $HOME_DIR ====="
            echo "--- daemon.log: provider/lane/exclusion lines ---"
            grep -E "reader-drive|stub|exclud|rank|health|provider|lane|qwen|planning|refus" "$HOME_DIR/daemon.log" 2>/dev/null | head -60
            echo "--- daemon.log tail ---"
            tail -20 "$HOME_DIR/daemon.log" 2>/dev/null
            echo "--- db schema and events ---"
            python - "$DB" <<'EOF'
          import json, sqlite3, sys
          conn = sqlite3.connect(sys.argv[1])
          conn.row_factory = sqlite3.Row
          try:
              cols = [r[1] for r in conn.execute("PRAGMA table_info(runtime_session_events)").fetchall()]
              print("runtime_session_events columns:", cols)
              rows = conn.execute(
                  "SELECT * FROM runtime_session_events ORDER BY rowid DESC LIMIT 400"
              ).fetchall()
              hits = 0
              for row in rows:
                  text = json.dumps({k: (str(row[k])[:220] if row[k] is not None else None) for k in row.keys()}, default=str)
                  low = text.lower()
                  if "reader" in low or "exclud" in low or "rank" in low or "health" in low or "stub" in low:
                      print("EVENT:", text[:700])
                      hits += 1
                      if hits > 30:
                          break
          except Exception as e:
              print("events dump failed:", e)
          try:
              rows = conn.execute("SELECT * FROM model_provider_manifests").fetchall()
              for row in rows:
                  d = {k: row[k] for k in row.keys()}
                  print("MANIFEST:", json.dumps(d, default=str)[:700])
          except Exception as e:
              print("manifests dump failed:", e)
          EOF
            echo "--- routing/exclusion events ---"
            python - "$DB" <<'EOF'
          import json, sqlite3, sys
          conn = sqlite3.connect(sys.argv[1])
          try:
              rows = conn.execute(
                  "SELECT payload FROM runtime_session_events WHERE payload LIKE '%excluded%' "
                  "OR payload LIKE '%provider%' OR payload LIKE '%health%' OR payload LIKE '%rank%' "
                  "ORDER BY rowid DESC LIMIT 40"
              ).fetchall()
          except Exception as e:
              print("events query failed:", e)
              rows = []
          for (payload,) in rows:
              try:
                  print(json.dumps(json.loads(payload))[:600])
              except Exception:
                  print(str(payload)[:600])
          EOF
          done
      - name: Dump rig home tree shapes
        if: always()
        run: |
          set +e
          for D in $(for BASE in /tmp /var/folders; do find "$BASE" -maxdepth 6 -type d \( -name "*reader*" -o -name "vool_pytest_home_*" -o -name "*served*" \) -newermt "-30 minutes" 2>/dev/null; done | head -10); do
            echo "=== $D ==="
            find "$D" -maxdepth 3 | head -25
          done
