name: Code-task child debug

on:
  push:
    branches: [debug/codetask-child]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser,companion,evm]"
      - name: Provision the kernel sandbox backend (bubblewrap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap apparmor
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          if ! sudo apparmor_parser -r /etc/apparmor.d/bwrap; then
            echo "bwrap profile refused by this host's apparmor; relaxing the userns restriction globally"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-net --ro-bind / / --tmpfs /tmp -- true
      - name: Environment facts
        run: |
          echo "TMPDIR=${TMPDIR:-<unset>}"
          echo "RUNNER_TEMP=${RUNNER_TEMP:-<unset>}"
          python - <<'EOF'
          import tempfile, os
          print("python gettempdir:", tempfile.gettempdir())
          print("python TMPDIR env:", os.environ.get("TMPDIR"))
          EOF
      - name: Direct reproduction with full untruncated stderr
        run: |
          set +e
          python - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          from pathlib import Path
          from tests.test_code_task_purposeful_verification import _seed_sandbox_pytest_into
          proj = Path("/tmp/ctdirect/project")
          (proj / "tests").mkdir(parents=True, exist_ok=True)
          (proj / "tests" / "__init__.py").write_text("")
          _seed_sandbox_pytest_into(proj)
          (proj / "tests" / "test_ledger.py").write_text("def test_x():\n    assert 1\n")
          print("seeded", proj)
          EOF
          echo "--- tempfile probe under bwrap ---"
          bwrap --unshare-net --ro-bind / / --tmpfs /tmp -- python3 -c "from tempfile import TemporaryFile; TemporaryFile(); print('tempfile ok')"
          echo "tempfile rc=$?"
          echo "--- vendored pytest --version under bwrap ---"
          bwrap --unshare-net --ro-bind / / --tmpfs /tmp --bind /tmp/ctdirect/project /tmp/ctdirect/project -- python3 -c "import sys; sys.path.insert(0, '/tmp/ctdirect/project'); import pytest; print(pytest.__version__)"
          echo "version rc=$?"
          echo "--- the child command itself, full stderr ---"
          bwrap --unshare-net --ro-bind / / --tmpfs /tmp --bind /tmp/ctdirect/project /tmp/ctdirect/project -- python3 -m pytest -q /tmp/ctdirect/project/tests/test_ledger.py
          echo "direct rc=$?"
          echo "--- same but WITHOUT --tmpfs /tmp ---"
          bwrap --unshare-net --ro-bind / / -- python3 -m pytest -q /tmp/ctdirect/project/tests/test_ledger.py
          echo "no-tmpfs rc=$?"
      - name: Control - the failing r4 case as-is
        run: |
          set +e
          python -m pytest -q --tb=line -p no:cacheprovider "tests/test_code_task_invocation_contract_r4.py::test_equivalent_or_broader_filters_still_cover[python3 -m pytest -q tests/test_ledger.py]"
          echo "control rc=$?"
      - name: A/B - same case with TMPDIR pointing inside the sandbox tmpfs
        run: |
          set +e
          TMPDIR=/tmp python -m pytest -q --tb=line -p no:cacheprovider "tests/test_code_task_invocation_contract_r4.py::test_equivalent_or_broader_filters_still_cover[python3 -m pytest -q tests/test_ledger.py]"
          echo "tmpdir-ab rc=$?"
      - name: A/B - writable /dev binds in the sandbox
        run: |
          set +e
          echo "--- devnull probe with writable bind ---"
          bwrap --unshare-net --ro-bind / / --tmpfs /tmp --bind /dev/null /dev/null -- python3 -c "open('/dev/null','r+b'); print('devnull ok')"
          echo "devnull rc=$?"
          echo "--- full r4 case with writable dev binds monkeypatched in ---"
          python - <<'EOF'
          import re
          from pathlib import Path
          p = Path("sandbox/job_runner.py")
          src = p.read_text()
          patched = src.replace(
              'cmd: list[str] = [bwrap, *net_flag, "--ro-bind", "/", "/", "--tmpfs", "/tmp"]',
              'cmd: list[str] = [bwrap, *net_flag, "--ro-bind", "/", "/", "--tmpfs", "/tmp",\n'
              '                       "--bind", "/dev/null", "/dev/null", "--bind", "/dev/zero", "/dev/zero",\n'
              '                       "--bind", "/dev/random", "/dev/random", "--bind", "/dev/urandom", "/dev/urandom"]',
          )
          assert patched != src, "patch anchor not found"
          p.write_text(patched)
          print("patched _linux_bwrap_prefix with writable dev binds")
          EOF
          python -m pytest -q --tb=line -p no:cacheprovider "tests/test_code_task_invocation_contract_r4.py::test_equivalent_or_broader_filters_still_cover[python3 -m pytest -q tests/test_ledger.py]"
          echo "devbinds rc=$?"
          git checkout -- sandbox/job_runner.py
      - name: Dump the code-task journals from the session homes
        if: always()
        run: |
          set +e
          echo "=== journal locations ==="
          find /tmp /home/runner -maxdepth 12 -name "*.json" -path "*code_tasks*" -newermt "-20 minutes" 2>/dev/null | head -30
          echo "=== live journal step outputs (full stderr) ==="
          for J in $(find /tmp /home/runner -maxdepth 12 -name "*.json" -path "*code_tasks*" -newermt "-20 minutes" 2>/dev/null | grep -v fixtures | head -6); do
            echo "----- $J -----"
            python - "$J" <<'EOF'
          import json, sys
          try:
              doc = json.load(open(sys.argv[1]))
          except Exception as e:
              print("unparseable:", e); raise SystemExit
          def walk(node):
              if isinstance(node, dict):
                  if "stderr" in node or "stdout" in node or "returncode" in node:
                      for k in ("command", "returncode", "status"):
                          if k in node:
                              print(f"{k}: {node[k]}")
                      for k in ("stderr", "stdout"):
                          if node.get(k):
                              text = str(node[k])
                              for i in range(0, min(len(text), 12000), 4000):
                                  print(f"--- {k}[{i}:{i+4000}] ---")
                                  print(text[i:i+4000])
                  for v in node.values():
                      walk(v)
              elif isinstance(node, list):
                  for v in node:
                      walk(v)
          walk(doc)
          EOF
          done
      - name: Also probe the sandbox view of tmp directly
        if: always()
        run: |
          set +e
          MARKER=$(mktemp -d)/probe-file
          echo x > "$MARKER"
          echo "outer path: $MARKER"
          bwrap --unshare-net --ro-bind / / --tmpfs /tmp -- cat "$MARKER" 2>&1 | head -3
          echo "bwrap cat rc=$?"
          ls -la /tmp | head -5
