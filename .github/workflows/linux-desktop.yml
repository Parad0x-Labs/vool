name: Linux desktop acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/**'
      - 'core/**'
      - 'apps/**'
      - 'storage/**'
      - 'retrieval/**'
      - 'config/**'
      - 'ops/linux_desktop_smoke.py'
      - 'tests/test_release_platform_launch.py'
      - 'pyproject.toml'
      - '.github/workflows/linux-desktop.yml'

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Provision real GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-webkit2-4.1 xvfb xdotool openbox libglib2.0-bin desktop-file-utils
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            # VOOL needs Python 3.11+, and 22.04's distro Python is 3.10, which is the only one its
            # python3-gi is built for. Use the distro's python3.11 and build the GTK bindings into
            # the venv from source against 22.04's GObject introspection 1.72 / cairo. PyGObject 3.50
            # is the last series that builds against girepository-1.0 (3.51+ needs girepository-2.0,
            # which 22.04 does not ship).
            sudo apt-get install -y python3.11 python3.11-venv python3.11-dev libgirepository1.0-dev libcairo2-dev pkg-config gcc
            python3.11 -m venv "$RUNNER_TEMP/desktop-venv"
            "$RUNNER_TEMP/desktop-venv/bin/python" -m pip install --upgrade pip 'setuptools>=64' wheel
            "$RUNNER_TEMP/desktop-venv/bin/python" -m pip install 'PyGObject==3.50.2' 'pycairo==1.29.2'
          else
            sudo apt-get install -y python3-venv python3-gi python3-gi-cairo
            python3 -m venv --system-site-packages "$RUNNER_TEMP/desktop-venv"
            # The distro-seeded installer toolchain is part of the install contract: raise the venv's
            # own installer toolchain before the editable install so it uses a backend that supports
            # PEP 660 ("build backend is missing the 'build_editable' hook" otherwise, run 36982838739).
            "$RUNNER_TEMP/desktop-venv/bin/python" -m pip install --upgrade pip 'setuptools>=64' wheel
          fi
          "$RUNNER_TEMP/desktop-venv/bin/python" -c "import sys; assert sys.version_info >= (3, 11), sys.version"
          "$RUNNER_TEMP/desktop-venv/bin/python" -c "import gi; gi.require_version('Gtk', '3.0'); gi.require_version('WebKit2', '4.1'); from gi.repository import Gtk, WebKit2"
          "$RUNNER_TEMP/desktop-venv/bin/python" -m pip install -e '.[dev]' 'pywebview>=6.1,<7'
      - name: Installer and ownership regression
        env:
          VOOL_HOME: ${{ runner.temp }}/regression-profile
        run: |
          "$RUNNER_TEMP/desktop-venv/bin/python" -m pytest -q tests/test_release_platform_launch.py tests/test_bootstrap_install_contract.py tests/test_install_script_contract.py tests/test_native_runtime_supervisor.py --basetemp "$RUNNER_TEMP/regression"
      - name: Open real native chat and prove shutdown
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          xvfb-run -a bash <<'DESKTOP'
          set -euo pipefail
          openbox > "$RUNNER_TEMP/evidence/window-manager.log" 2>&1 &
          wm_pid=$!
          trap 'kill "$wm_pid" 2>/dev/null || true; wait "$wm_pid" 2>/dev/null || true' EXIT
          "$RUNNER_TEMP/desktop-venv/bin/python" ops/linux_desktop_smoke.py --profile "$RUNNER_TEMP/native-profile" --output "$RUNNER_TEMP/evidence/native.json" --expected-commit "$(git rev-parse HEAD)"
          DESKTOP
      - name: Preserve acceptance evidence and environment
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          uname -a > "$RUNNER_TEMP/evidence/kernel.txt"
          "$RUNNER_TEMP/desktop-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/evidence/dependencies.txt"
          cp -R "$RUNNER_TEMP/native-profile/logs" "$RUNNER_TEMP/evidence/logs" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence/
