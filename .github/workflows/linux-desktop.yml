name: Linux desktop acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/**'
      - 'core/**'
      - 'apps/**'
      - 'storage/**'
      - 'retrieval/**'
      - 'config/**'
      - 'ops/linux_desktop_smoke.py'
      - 'tests/test_release_platform_launch.py'
      - 'pyproject.toml'
      - '.github/workflows/linux-desktop.yml'

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Provision real GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-webkit2-4.1 xvfb xdotool openbox libglib2.0-bin desktop-file-utils
          python3 -m venv --system-site-packages "$RUNNER_TEMP/desktop-venv"
          # The distro-seeded installer toolchain is part of the install contract: ubuntu-22.04's
          # ensurepip yields the patched pip 22.0.2 with a pre-PEP-660 setuptools visible through
          # --system-site-packages, and the editable install died in backend selection with
          # "build backend is missing the 'build_editable' hook" (run 36982838739, job
          # 110761046634) while ubuntu-24.04's newer toolchain built the same tree fine. Raise
          # the venv's own installer toolchain before the editable install so both runners use a
          # backend that supports PEP 660.
          "$RUNNER_TEMP/desktop-venv/bin/python" -m pip install --upgrade pip 'setuptools>=64' wheel
          "$RUNNER_TEMP/desktop-venv/bin/python" -m pip install -e '.[dev]' 'pywebview>=6.1,<7'
      - name: Installer and ownership regression
        env:
          VOOL_HOME: ${{ runner.temp }}/regression-profile
        run: |
          "$RUNNER_TEMP/desktop-venv/bin/python" -m pytest -q tests/test_release_platform_launch.py tests/test_bootstrap_install_contract.py tests/test_install_script_contract.py tests/test_native_runtime_supervisor.py --basetemp "$RUNNER_TEMP/regression"
      - name: Open real native chat and prove shutdown
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          xvfb-run -a bash <<'DESKTOP'
          set -euo pipefail
          openbox > "$RUNNER_TEMP/evidence/window-manager.log" 2>&1 &
          wm_pid=$!
          trap 'kill "$wm_pid" 2>/dev/null || true; wait "$wm_pid" 2>/dev/null || true' EXIT
          "$RUNNER_TEMP/desktop-venv/bin/python" ops/linux_desktop_smoke.py --profile "$RUNNER_TEMP/native-profile" --output "$RUNNER_TEMP/evidence/native.json" --expected-commit "$(git rev-parse HEAD)"
          DESKTOP
      - name: Preserve acceptance evidence and environment
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          uname -a > "$RUNNER_TEMP/evidence/kernel.txt"
          "$RUNNER_TEMP/desktop-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/evidence/dependencies.txt"
          cp -R "$RUNNER_TEMP/native-profile/logs" "$RUNNER_TEMP/evidence/logs" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence/
