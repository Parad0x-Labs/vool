name: Conftest race debug 5

on:
  push:
    branches: [debug/conftest-race5]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser,companion,evm]"
      - name: Provision the kernel sandbox backend (bubblewrap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap apparmor
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          if ! sudo apparmor_parser -r /etc/apparmor.d/bwrap; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-net --ro-bind / / --tmpfs /tmp -- true
      - name: Provision the served-browser lane (Playwright chromium)
        run: python -m playwright install --with-deps chromium
      - name: Write the wallet canary probe
        run: |
          cat > /tmp/wallet_canary.py <<'EOF'
          import sys

          _state = {"session": None, "healthy": True, "count": 0, "dumped": False}

          def _desc(fm, name):
              defs = fm._arg2fixturedefs.get(name)
              if not defs:
                  return "ABSENT"
              return [
                  {
                      "id": id(d),
                      "baseid": getattr(d, "baseid", None),
                      "node_type": type(getattr(d, "node", None)).__name__ if d.node is not None else None,
                      "node_nodeid": getattr(d, "node", None).nodeid if d.node is not None else None,
                      "node_id": id(getattr(d, "node", None)),
                  }
                  for d in defs
              ]

          def pytest_collection_finish(session):
              fm = session._fixturemanager
              _state["session"] = session
              # Every Package/Directory collector whose nodeid mentions wallet, and every
              # wallet test item's ancestry vs the fixture defs. This is the decisive dump:
              # whether the def's node object is identity-equal to the items' ancestors.
              print("=== WALLET COLLECTORS ===", file=sys.stderr, flush=True)
              stack = [session]
              seen = set()
              while stack:
                  node = stack.pop()
                  if id(node) in seen:
                      continue
                  seen.add(id(node))
                  nid = getattr(node, "nodeid", "")
                  if "wallet" in str(nid) and type(node).__name__ in {"Package", "Directory"}:
                      print(f"  collector {type(node).__name__} nodeid={nid!r} id={id(node)} path={getattr(node, 'path', None)}", file=sys.stderr, flush=True)
                  stack.extend(getattr(node, "children", []) or [])
              print("=== WALLET ITEMS ===", file=sys.stderr, flush=True)
              sample = [i for i in session.items if str(i.nodeid).startswith("tests/wallet/")][:3]
              for item in sample:
                  parents = [(type(n).__name__, n.nodeid, id(n)) for n in item.iter_parents()]
                  print(f"  item {item.nodeid[:90]}", file=sys.stderr, flush=True)
                  for p in parents[:6]:
                      print(f"    parent {p}", file=sys.stderr, flush=True)
                  snap = getattr(getattr(item, "_fixtureinfo", None), "name2fixturedefs", None) or {}
                  print(f"    wallet_env in snapshot={('wallet_env' in snap)}", file=sys.stderr, flush=True)
              print("=== REGISTRY wallet_env ===", file=sys.stderr, flush=True)
              print(f"  {_desc(fm, 'wallet_env')}", file=sys.stderr, flush=True)
              canary = next((i for i in session.items if str(i.nodeid).startswith("tests/wallet/")), None)
              _state["canary"] = canary
              if canary is not None:
                  defs = fm.getfixturedefs("wallet_env", canary)
                  print(f"CANARY-INIT {canary.nodeid[:80]} visible={len(defs or ())}", file=sys.stderr, flush=True)

          def pytest_runtest_logstart(nodeid, location):
              if _state["dumped"] or not _state.get("healthy"):
                  return
              fm = _state["session"]._fixturemanager if _state.get("session") else None
              canary = _state.get("canary")
              if fm is None or canary is None:
                  return
              _state["count"] += 1
              defs = fm.getfixturedefs("wallet_env", canary)
              if defs is not None and len(defs) == 0 and _state["healthy"]:
                  _state["healthy"] = False
                  _state["dumped"] = True
                  print(f"CANARY-BROKEN at test #{_state["count"]} after {nodeid}", file=sys.stderr, flush=True)
                  print(f"  registry now: {_desc(fm, 'wallet_env')}", file=sys.stderr, flush=True)
                  parents = [(type(n).__name__, n.nodeid, id(n)) for n in canary.iter_parents()]
                  for p in parents:
                      print(f"  canary parent {p}", file=sys.stderr, flush=True)
          EOF
      - name: Resolve this shard's test files (verbatim ci.yml resolver)
        run: |
          mkdir -p .verification-logs
          python - <<'EOF'
          import subprocess, sys
          from pathlib import Path

          shard = 6
          shards = 10
          collected = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q", "-p", "no:cacheprovider"],
              capture_output=True, text=True, check=True,
          ).stdout
          files = sorted({line.split("::", 1)[0] for line in collected.splitlines() if "::" in line})
          macos_only = {
              "tests/test_macos_app_packaging.py",
              "tests/updater/test_e2e_sandbox.py",
              "tests/test_artifact_readers_contracts.py",
              "tests/test_artifact_readers_served_m1.py",
              "tests/test_artifact_readers_served_m2.py",
              "tests/test_audio_dictation.py",
              "tests/test_media_product_served.py",
          }
          files = [f for f in files if f not in macos_only]
          sized = sorted(files, key=lambda f: -Path(f).stat().st_size)
          mine = [f for index, f in enumerate(sized) if index % shards == shard]
          Path(".verification-logs", f"shard-{shard}-files.txt").write_text("\n".join(mine) + "\n")
          print(f"shard {shard}/{shards}: {len(mine)} of {len(sized)} files")
          EOF
      - name: Run shard 6 exactly as ci.yml does with the wallet canary
        run: >-
          PYTHONPATH=/tmp python -m pytest -q --tb=line -p no:cacheprovider
          -p wallet_canary $(tr '\n' ' ' < .verification-logs/shard-6-files.txt)
