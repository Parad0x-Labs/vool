name: Conftest race debug 4

on:
  push:
    branches: [debug/conftest-race4]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser,companion,evm]"
      - name: Provision the kernel sandbox backend (bubblewrap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap apparmor
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          if ! sudo apparmor_parser -r /etc/apparmor.d/bwrap; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-net --ro-bind / / --tmpfs /tmp -- true
      - name: Provision the served-browser lane (Playwright chromium)
        run: python -m playwright install --with-deps chromium
      - name: Write the canary probe
        run: |
          cat > /tmp/fixture_canary.py <<'EOF'
          import sys

          _state = {"canary": None, "healthy": True, "count": 0}

          def _defs_desc(fm, name):
              defs = fm._arg2fixturedefs.get(name)
              if not defs:
                  return "ABSENT"
              out = []
              for d in defs:
                  node = getattr(d, "node", None)
                  out.append({
                      "id": id(d),
                      "argname": d.argname,
                      "baseid": getattr(d, "baseid", None),
                      "node_type": type(node).__name__ if node is not None else None,
                      "node_nodeid": getattr(node, "nodeid", None) if node is not None else None,
                      "node_id": id(node),
                      "func": repr(getattr(d, "func", None))[:60],
                  })
              return out

          def pytest_collection_finish(session):
              fm = session._fixturemanager
              for item in session.items:
                  if "wallet" in item.nodeid:
                      _state["canary"] = item
                      break
              canary = _state["canary"]
              if canary is None:
                  print("CANARY: no wallet item collected", file=sys.stderr, flush=True)
                  return
              defs = fm.getfixturedefs("wallet_env", canary)
              parents = {id(n) for n in canary.iter_parents()}
              print("CANARY-INIT nodeid=%s visible_defs=%d" % (canary.nodeid, len(defs or ())), file=sys.stderr, flush=True)
              print("CANARY-INIT registry=%s" % _defs_desc(fm, "wallet_env"), file=sys.stderr, flush=True)
              print("CANARY-INIT parent_ids=%r parent_nodeids=%r" % (
                  sorted(parents), [n.nodeid for n in canary.iter_parents()]), file=sys.stderr, flush=True)
              _state["session"] = session

          def pytest_runtest_logstart(nodeid, location):
              fm = _state.get("session") and _state["session"]._fixturemanager
              canary = _state.get("canary")
              if fm is None or canary is None or not _state["healthy"]:
                  return
              _state["count"] += 1
              defs = fm.getfixturedefs("wallet_env", canary)
              if not defs:
                  _state["healthy"] = False
                  print("CANARY-BROKEN at test #%d nodeid=%s" % (_state["count"], nodeid), file=sys.stderr, flush=True)
                  print("CANARY-BROKEN registry=%s" % _defs_desc(fm, "wallet_env"), file=sys.stderr, flush=True)
                  parents = {id(n) for n in canary.iter_parents()}
                  print("CANARY-BROKEN parent_ids=%r parent_nodeids=%r" % (
                      sorted(parents), [n.nodeid for n in canary.iter_parents()]), file=sys.stderr, flush=True)
                  print("CANARY-BROKEN pending=%r" % [str(k) for k in fm._pending_conftests], file=sys.stderr, flush=True)
                  import gc
                  conftest_mods = {k: getattr(v, "__file__", None) for k, v in sys.modules.items() if "conftest" in k}
                  print("CANARY-BROKEN sys.modules=%s" % conftest_mods, file=sys.stderr, flush=True)
          EOF
      - name: Resolve this shard's test files (verbatim ci.yml resolver)
        run: |
          mkdir -p .verification-logs
          python - <<'EOF'
          import subprocess, sys
          from pathlib import Path

          shard = 6
          shards = 10
          collected = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q", "-p", "no:cacheprovider"],
              capture_output=True, text=True, check=True,
          ).stdout
          files = sorted({line.split("::", 1)[0] for line in collected.splitlines() if "::" in line})
          macos_only = {
              "tests/test_macos_app_packaging.py",
              "tests/updater/test_e2e_sandbox.py",
              "tests/test_artifact_readers_contracts.py",
              "tests/test_artifact_readers_served_m1.py",
              "tests/test_artifact_readers_served_m2.py",
              "tests/test_audio_dictation.py",
              "tests/test_media_product_served.py",
          }
          files = [f for f in files if f not in macos_only]
          sized = sorted(files, key=lambda f: -Path(f).stat().st_size)
          mine = [f for index, f in enumerate(sized) if index % shards == shard]
          Path(".verification-logs", f"shard-{shard}-files.txt").write_text("\n".join(mine) + "\n")
          print(f"shard {shard}/{shards}: {len(mine)} of {len(sized)} files")
          EOF
      - name: Run shard 6 exactly as ci.yml does with the canary
        run: >-
          PYTHONPATH=/tmp python -m pytest -q --tb=line -p no:cacheprovider
          -p fixture_canary $(tr '\n' ' ' < .verification-logs/shard-6-files.txt)
