name: Conftest race debug 3

on:
  push:
    branches: [debug/conftest-race3]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser,companion,evm]"
      - name: Provision the kernel sandbox backend (bubblewrap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap apparmor
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          if ! sudo apparmor_parser -r /etc/apparmor.d/bwrap; then
            echo "bwrap profile refused by this host's apparmor; relaxing the userns restriction globally"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-net --ro-bind / / --tmpfs /tmp -- true
      - name: Provision the served-browser lane (Playwright chromium)
        run: python -m playwright install --with-deps chromium
      - name: Write the fixture-gap probe
        run: |
          cat > /tmp/fixture_gap_probe.py <<'EOF'
          import os
          import sys

          SPECIAL = {"request", "pytestconfig"}
          _dumped = {"done": False}

          def _dump(fm, item):
              print("=== RUNTIME GAP DUMP ===", file=sys.stderr, flush=True)
              print("cwd=%s" % os.getcwd(), file=sys.stderr, flush=True)
              print("rootpath=%s" % item.config.rootpath, file=sys.stderr, flush=True)
              print("--- pending conftests ---", file=sys.stderr, flush=True)
              for k in fm._pending_conftests:
                  print("  pending: %s" % k, file=sys.stderr, flush=True)
              print("--- sys.modules conftest entries ---", file=sys.stderr, flush=True)
              for k in sorted(sys.modules):
                  if "conftest" in k:
                      print("  %s -> %s" % (k, getattr(sys.modules[k], "__file__", None)), file=sys.stderr, flush=True)
              print("--- registry baseids for key names ---", file=sys.stderr, flush=True)
              for name in ("wallet_env", "rpc", "usepod_home", "usepod_service", "seeded", "auto_context", "arch_home"):
                  defs = fm._arg2fixturedefs.get(name)
                  if not defs:
                      print("  %s: ABSENT" % name, file=sys.stderr, flush=True)
                  else:
                      print("  %s: baseids=%r" % (name, [getattr(d, "baseid", None) for d in defs]), file=sys.stderr, flush=True)
              print("--- item ancestry ---", file=sys.stderr, flush=True)
              node = item
              while node is not None:
                  print("  %s %r path=%s" % (type(node).__name__, node.nodeid, getattr(node, "path", None)), file=sys.stderr, flush=True)
                  node = node.parent

          def pytest_collection_finish(session):
              fm = session._fixturemanager
              print("=== PENDING CONFTESTS AT FINISH (pre-clear) ===", file=sys.stderr, flush=True)
              for k in fm._pending_conftests:
                  print("  pending: %s" % k, file=sys.stderr, flush=True)
              gaps = {}
              for item in session.items:
                  params = set(getattr(getattr(item, "callspec", None), "params", ()) or ())
                  snapshot = getattr(getattr(item, "_fixtureinfo", None), "name2fixturedefs", None) or {}
                  for name in getattr(item, "fixturenames", ()):
                      if name in SPECIAL or name in params:
                          continue
                      if snapshot.get(name) is None and fm.getfixturedefs(name, item) is None:
                          gaps.setdefault(name, []).append(item.nodeid)
              if gaps:
                  print("=== FIXTURE GAPS AT COLLECTION (setup-equivalent) ===", file=sys.stderr, flush=True)
                  for name, nodeids in sorted(gaps.items()):
                      print("  %s: %d items, e.g. %s" % (name, len(nodeids), nodeids[:3]), file=sys.stderr, flush=True)
                  sample = next(iter(gaps.values()))[0]
                  for item in session.items:
                      if item.nodeid == sample:
                          _dump(fm, item)
                          break
                  print("PROBE-RESULT: GAP (%d items)" % sum(len(v) for v in gaps.values()), file=sys.stderr, flush=True)
                  raise SystemExit(99)
              print("PROBE-RESULT: CLEAN at collection", file=sys.stderr, flush=True)

          def pytest_runtest_setup(item):
              if _dumped["done"]:
                  return
              if "wallet" not in item.nodeid and "usepod" not in item.nodeid:
                  return
              fm = item.config.pluginmanager.get_plugin("funcmanage")
              snapshot = getattr(getattr(item, "_fixtureinfo", None), "name2fixturedefs", None) or {}
              for name in ("wallet_env", "usepod_home", "usepod_service"):
                  if name in getattr(item, "fixturenames", ()) and snapshot.get(name) is None and fm.getfixturedefs(name, item) is None:
                      _dumped["done"] = True
                      _dump(fm, item)
                      print("PROBE-RESULT: RUNTIME GAP on %s" % item.nodeid, file=sys.stderr, flush=True)
                      return
          EOF
      - name: Resolve this shard's test files (verbatim ci.yml resolver)
        run: |
          mkdir -p .verification-logs
          python - <<'EOF'
          import subprocess, sys
          from pathlib import Path

          shard = 6
          shards = 10
          collected = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q", "-p", "no:cacheprovider"],
              capture_output=True, text=True, check=True,
          ).stdout
          files = sorted({line.split("::", 1)[0] for line in collected.splitlines() if "::" in line})
          macos_only = {
              "tests/test_macos_app_packaging.py",
              "tests/updater/test_e2e_sandbox.py",
              "tests/test_artifact_readers_contracts.py",
              "tests/test_artifact_readers_served_m1.py",
              "tests/test_artifact_readers_served_m2.py",
              "tests/test_audio_dictation.py",
              "tests/test_media_product_served.py",
          }
          dropped = sorted(set(files) & macos_only)
          if set(dropped) != macos_only:
              raise SystemExit(
                  f"macos routing drifted: expected exactly {sorted(macos_only)}, collected {dropped}"
              )
          files = [f for f in files if f not in macos_only]
          sized = sorted(files, key=lambda f: -Path(f).stat().st_size)
          mine = [f for index, f in enumerate(sized) if index % shards == shard]
          Path(".verification-logs", f"shard-{shard}-files.txt").write_text("\n".join(mine) + "\n")
          total = sum(1 for _ in sized)
          print(f"shard {shard}/{shards}: {len(mine)} of {total} files ({len(macos_only)} routed to macos)")
          EOF
      - name: Run shard 6 exactly as ci.yml does
        run: >-
          PYTHONPATH=/tmp python -m pytest -q --tb=short -p no:cacheprovider
          -p fixture_gap_probe $(tr '\n' ' ' < .verification-logs/shard-6-files.txt)
