name: Diagnostic - lend worker on macOS (not a gate)
on:
  push:
    branches: [diagnostic/v08-lend-macos-20261113]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,browser,companion,evm]"
      - run: python ops/diagnostics/lend_macos_diag.py
      - run: python -m pytest -q -p no:cacheprovider tests/lend tests/test_media_product_served.py --tb=short
        if: always()
      - run: log show --last 10m --style compact --predicate 'sender == "Sandbox"' | tail -60
        if: always()
