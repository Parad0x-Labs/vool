name: Linux release package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/bundle/build_linux_bundle.sh'
      - 'installer/bundle/linux/**'
      - 'installer/stamp_build_source.py'
      - 'ops/linux_bundle_smoke.py'
      - 'tests/test_linux_bundle_packaging.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - '.github/workflows/release-linux.yml'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.1'
      - name: Record the exact packaged source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Installer and packaging regression
        run: |
          uv run --no-project --with pytest==9.1.1 --with pyyaml python -m pytest --noconftest -q tests/test_linux_bundle_packaging.py
      - name: Build self-contained Linux x86_64 tarball
        run: bash installer/bundle/build_linux_bundle.sh --out "$RUNNER_TEMP/linux-release"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-package
          path: ${{ runner.temp }}/linux-release/vool-*-linux-x86_64.tar.gz*
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-package
          path: ${{ runner.temp }}/linux-release
      - name: Verify download, install, answer, stop, and uninstall
        env:
          EXPECTED_COMMIT: ${{ needs.build.outputs.source }}
        run: |
          cd "$RUNNER_TEMP/linux-release"
          sha256sum -c vool-*-linux-x86_64.tar.gz.sha256
          python "$GITHUB_WORKSPACE/ops/linux_bundle_smoke.py" --archive "$(find "$RUNNER_TEMP/linux-release" -name '*.tar.gz' -print -quit)" --scratch "$RUNNER_TEMP/linux-smoke" --expected-commit "$EXPECTED_COMMIT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-x86_64-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/linux-smoke/runtime.log
            ${{ runner.temp }}/linux-smoke/response.json
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-package
          path: assets
      - name: Attach verified package to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes 'Release artifacts awaiting final approval.'
          fi
          gh release upload "$RELEASE_TAG" assets/*.tar.gz assets/*.sha256
