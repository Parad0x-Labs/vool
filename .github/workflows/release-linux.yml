name: Linux release package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/bundle/build_linux_bundle.sh'
      - 'installer/bundle/linux/**'
      - 'installer/build_update_payload.py'
      - 'core/updater/archive.py'
      - 'installer/stamp_build_source.py'
      - 'ops/linux_bundle_smoke.py'
      - 'tests/test_linux_bundle_packaging.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - '.github/workflows/release-linux.yml'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.1'
      - name: Record the exact packaged source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Installer and packaging regression
        run: |
          uv run --no-project --with pytest==9.1.1 --with pyyaml python -m pytest --noconftest -q tests/test_linux_bundle_packaging.py
      - name: Build self-contained Linux x86_64 tarball
        run: bash installer/bundle/build_linux_bundle.sh --out "$RUNNER_TEMP/linux-release"
      - name: In-app update payload for installed packages (the same package, zipped for the signed feed)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/linux-release"
          tarball="$(ls vool-*-linux-x86_64.tar.gz)"
          version="$(python3 -c 'import json; print(json.load(open("'"$GITHUB_WORKSPACE"'/config/release/update_channel.json"))["release_version"].removesuffix("-beta"))')"
          mkdir "$RUNNER_TEMP/package-extract"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/package-extract"
          (cd "$GITHUB_WORKSPACE" && python3 -m installer.build_update_payload --platform linux-x64-bundle \
            --version "$version" --source "$RUNNER_TEMP/package-extract/${tarball%.tar.gz}" --out "$RUNNER_TEMP/linux-release")
          for f in *-package-update.zip; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-package
          path: |
            ${{ runner.temp }}/linux-release/vool-*-linux-x86_64.tar.gz*
            ${{ runner.temp }}/linux-release/vool-*-linux-x86_64-package-update.zip*
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-package
          path: ${{ runner.temp }}/linux-release
      - name: Verify download, install, answer, stop, and uninstall
        env:
          EXPECTED_COMMIT: ${{ needs.build.outputs.source }}
        run: |
          cd "$RUNNER_TEMP/linux-release"
          sha256sum -c vool-*-linux-x86_64.tar.gz.sha256
          python "$GITHUB_WORKSPACE/ops/linux_bundle_smoke.py" --archive "$(find "$RUNNER_TEMP/linux-release" -name '*.tar.gz' -print -quit)" --scratch "$RUNNER_TEMP/linux-smoke" --expected-commit "$EXPECTED_COMMIT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-x86_64-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/linux-smoke/runtime.log
            ${{ runner.temp }}/linux-smoke/response.json
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-package
          path: assets
      - name: Attach verified package to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes 'Release artifacts awaiting final approval.'
          fi
          # The publish may already have attached the signed package (its manifest pins those exact
          # bytes). An asset already on the release is never replaced; its published checksum is
          # compared with this build's and both are reported. Only missing assets are uploaded.
          existing="$(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name')"
          missing=()
          for f in assets/*.tar.gz assets/*-package-update.zip assets/*.sha256; do
            name="$(basename "$f")"
            if ! grep -Fxq "$name" <<<"$existing"; then
              missing+=("$f")
              continue
            fi
            if [[ "$name" != *.sha256 ]]; then
              built="$(sha256sum "$f" | cut -d' ' -f1)"
              kept="$(gh release download "$RELEASE_TAG" --pattern "$name.sha256" --output - | cut -d' ' -f1)"
              if [[ "$built" == "$kept" ]]; then
                echo "kept: $name is already on $RELEASE_TAG with the same sha256 $kept"
              else
                echo "::notice::kept the published $name (sha256 $kept); this rebuild is $built and was not uploaded"
              fi
            fi
          done
          if (( ${#missing[@]} )); then
            gh release upload "$RELEASE_TAG" "${missing[@]}"
          fi
